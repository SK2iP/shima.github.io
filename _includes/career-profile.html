{% assign profile = site.data.data.career-profile %}
{% if profile %}
<section class="section summary-section" id="profile" aria-labelledby="profile-title">

  <h2 class="section-title" id="profile-title">
    <span class="section-icon" aria-hidden="true"><svg class="icon"><use href="#i-user" /></svg></span>
    {{ profile.title }}
  </h2>

  <div class="summary">
    {{ profile.summary | markdownify }}
  </div><!--//summary-->

</section><!--//section-->
{% endif %}
