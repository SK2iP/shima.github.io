career-profile:
    title: Career Profile
    summary: |
      Senior Frontend Developer with 5+ years of experience building high-performance, scalable web applications, including Okala, one of Iran's largest e-commerce platforms serving millions of users. Deep expertise in React, Next.js, and TypeScript, with a track record of contributing to major UI/UX redesigns, driving measurable performance gains, and shipping features across customer-facing, admin, and vendor panels. Experienced in AI-assisted, spec-driven development with Claude to accelerate delivery without compromising code quality. Thrives in Agile, cross-functional teams and is focused on clean architecture and real user impact.

experiences:
    title: Professional Experience
    info:
      - role: Frontend Developer (React / Next.js)
        company: Okala
        company_note: Large-Scale E-Commerce Platform, serving millions of users
        company_url: https://okala.com
        time: Oct 2021 - Present
        details: |
          - Contributed to two major redesign initiatives on Okala's main customer-facing platform, improving UI/UX consistency and usability for millions of users, using React, Next.js, TypeScript, and Tailwind CSS.
          - Improved core web performance metrics (LCP, CLS, FCP) on the main site through rendering optimization, code-splitting, and asset optimization, resulting in faster load times and higher user satisfaction.
          - Migrated map services from Cedar Map to Neshan and Parsi Map with minimal user disruption.
          - Upgraded the platform to Next.js 15 with the App Router, modernizing the codebase to improve maintainability and long-term scalability.
          - Built a rule-based automation engine that adjusts store behavior in real time (e.g., automatic service-radius reduction) based on conditions such as weather and order volume, reducing manual operations work.
          - Monitored and improved application stability using Grafana dashboards/alerting and the EFK stack (Elasticsearch, Fluentd, Kibana) for log analysis and error tracking.
          - Shipped features, UI redesigns, and bug fixes across the Admin and Vendor Panels using React, TypeScript, Redux, React Query, and Ant Design.
          - Played a key role in migrating the Admin Panel from Angular to React, supporting frontend architecture decisions for the platform's internal tooling.
          - Applied AI-assisted, spec-driven development with Claude to write specs and scaffold implementation, and used it for code review and technical documentation, speeding up delivery cycles.
          - Performed code reviews and supported junior developers with technical guidance and frontend best practices.
          - Collaborated closely with backend, product, design, and operations teams in an Agile/Scrum environment.

      - role: Frontend Developer (React / Next.js)
        company: Tapsi Doctor
        company_note: Healthcare & Telemedicine Platform
        company_url: https://tapsi.doctor/app
        time: May 2024 - Jan 2025
        concurrent: true
        concurrent_label: Concurrent Project
        details: |
          - Helped build the Tapsi Doctor platform from scratch alongside the Okala role, helping shape core frontend architecture, routing, and reusable component patterns with JavaScript (ES6+), TypeScript, React, Next.js, Redux, React Query, and Tailwind CSS.
          - Delivered a healthcare application supporting prescription and non-prescription drug sales, doctor appointment scheduling, and online medical consultations.
          - Implemented key user flows including medicine ordering, appointment scheduling, and real-time consultation features.
          - Partnered with backend, product, and medical domain stakeholders to translate healthcare requirements into reliable, production-ready features.

      - role: Freelance Frontend Developer
        company: Darsoo
        company_note: E-Commerce Platform for Mobile Phones, Tablets & Digital Gadgets
        company_url: https://darsoo.com
        time: Apr 2021 - Oct 2021
        details: |
          - Built responsive, user-friendly interfaces using JavaScript, jQuery, Axios, Ajax, HTML5, CSS3, and Bootstrap, ensuring cross-device compatibility and performance.
          - Improved overall user experience and interface consistency across the platform.

