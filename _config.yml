# Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Shima Nouri
tagline: Senior Frontend Developer

# Served from https://shima.github.io/shima.github.io/
# If this repo is ever transferred to a GitHub account named `shima`, it becomes
# a user site: set url to 'https://shima.github.io' and baseurl to ''.
url: 'https://shima.github.io'
baseurl: '/shima.github.io'

description: >-
  Shima Nouri is a Senior Frontend Developer in Tehran, Iran with 5+ years
  building high-performance React, Next.js and TypeScript applications.

# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: blue # blue turquoise green berry orange ceramic teal oceanstale
chrome_mobile_color: '#1976d2' # use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Tracker
# No analytics configured. Set to a GA4 measurement ID (G-XXXXXXX) to enable.
analytics:

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
